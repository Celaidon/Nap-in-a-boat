# configs/merges/split_attn_code.yaml
slices:
  - sources:
      - model: google/gemma-1.1-7b-it
        layer_range: [0, 28]
      - model: google/codegemma-1.1-7b-it
        layer_range: [0, 28]
merge_method: slerp
base_model: google/gemma-1.1-7b-it
parameters:
  t:
    - filter: self_attn
      value: 0.8
    - filter: mlp
      value: 0.2
    - value: 0.5
dtype: bfloat16
