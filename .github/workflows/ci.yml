name: ci
on: [pull_request, push]

permissions:
  contents: read

# A new push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/server.txt
      - name: Install the other tracks' dependencies (skipped while their files are empty)
        run: |
          for f in requirements/merge.txt requirements/eval.txt; do
            if [ -s "$f" ]; then pip install -r "$f"; fi
          done
      - name: Pre-pull the image Track B's code sandbox runs in (the first pull is slower than its timeout)
        run: docker pull python:3.11-slim
      - run: ruff check . --output-format=github
      - name: Contract schemas, committed data and repo hygiene
        run: python scripts/validate_repo.py
      - name: Tests for all tracks (nothing that needs real model files)
        shell: bash
        run: pytest -q -m "not models" -ra --tb=short 2>&1 | tee pytest.log
      - name: Show test failures in the job summary
        if: failure()
        run: |
          echo '### pytest output (tail)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 pytest.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the image (no models inside)
        run: docker build -f docker/Dockerfile -t blendlab:ci .
      - name: Run it with the mock files and smoke-test it
        run: |
          docker run -d --name blendlab -p 8000:8000 \
            -e REGISTRY_PATH=contracts/mocks/registry.json \
            -e METRICS_PATH=contracts/mocks/metrics.json \
            -e SCORING_MODULE=contracts.scoring \
            -e FAKE_GENERATOR=true \
            blendlab:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          pip install websockets==17.2
          python scripts/smoke_test.py http://localhost:8000 --tokens 10
      - name: Container logs
        if: failure()
        run: docker logs blendlab
